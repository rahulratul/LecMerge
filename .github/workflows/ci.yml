name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit and integration tests with coverage
        run: pytest tests/unit tests/integration --cov=app --cov-report=term-missing

      - name: Check headless Chrome availability
        run: google-chrome --version || chromium-browser --version

      - name: Run Selenium end-to-end smoke test
        run: pytest tests/e2e -q
